name: Agent Review

# Independent review gate for the auto-merge pipeline. Publishes an "agent-review" commit
# status that auto-merge requires. Two layers:
#   - Deterministic floor (this job): static boundary guardrails that can never be skipped.
#   - Semantic layer: the `customization-boundary-reviewer` custom agent
#     (.kiro/agents/) performs the full judgment-based review in-session / via a Crew
#     webhook. When that reports FAIL, it sets the same status to failure, blocking merge.
#
# This workflow is honest about scope: it enforces only what is mechanically checkable.
# It can never relax CI; auto-merge independently requires CI ("verify") to be green.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  deterministic-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static boundary guardrails
        id: check
        run: node scripts/boundary-check.mjs

      - name: Publish agent-review status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.check.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'agent-review',
              state: ok ? 'success' : 'failure',
              description: ok
                ? 'Deterministic boundary floor passed (semantic agent layer may add findings)'
                : 'Boundary guardrail blocker(s) found',
            });
