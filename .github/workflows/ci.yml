name: CI

# Deterministic verification: typecheck, lint, and the full test suite using the
# LABELED test-double inference adapter. No secrets, no network beyond npm. The real
# Anthropic agent is exercised in demos / a separate gated job, not here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (deterministic, test-double adapter)
        run: npm test

      - name: Build
        run: npm run build
