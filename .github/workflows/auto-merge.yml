name: Auto-merge

# PM directive: merges are automated via CI/CD with an independent review-agent gate,
# so they don't wait on a human — EXCEPT a narrow set of security-sensitive paths, which
# still require explicit human approval.
#
# Merge requires ALL of:
#   1. The CI workflow ("verify") concluded success on the PR head.
#   2. The independent review agent posted a PASS verdict (status check "agent-review").
#   3. The PR touches no sensitive paths — OR a maintainer added the "human-approved" label.
#
# The review agent is advisory + gating: it can block a merge but can NEVER relax CI or
# merge a red build (this job hard-requires CI success independently). This mirrors the
# product rule that untrusted proposals cannot bypass enforcement.

on:
  workflow_run:
    workflows: ["CI", "Agent Review"]
    types: [completed]
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always judge with the default branch's rule file, never the PR's copy.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve target PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // Find the open PR associated with this event.
            let pr;
            if (context.payload.pull_request) {
              pr = context.payload.pull_request;
            } else if (context.payload.workflow_run) {
              const prs = context.payload.workflow_run.pull_requests;
              if (prs && prs.length) {
                const got = await github.rest.pulls.get({
                  owner: context.repo.owner, repo: context.repo.repo, pull_number: prs[0].number });
                pr = got.data;
              }
            }
            if (!pr) { core.setOutput('skip', 'true'); return; }
            core.setOutput('skip', 'false');
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('labels', JSON.stringify(pr.labels.map(l => l.name)));

      - name: Check gates
        id: gates
        if: steps.pr.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number('${{ steps.pr.outputs.number }}');
            const sha = '${{ steps.pr.outputs.sha }}';
            const labels = JSON.parse('${{ steps.pr.outputs.labels }}' || '[]');

            // --- Sensitive-path detection (auto; no manual labeling needed) ---
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
            // Sensitive paths require the "human-approved" label before auto-merge.
            // The list lives in scripts/sensitive-paths.mjs (loaded from the default
            // branch checkout, so a PR cannot change the rule that judges it).
            // Vendored apps/**/foundation copies are NOT listed: CI job "verify" runs
            // scripts/vendored-parity.mjs, which fails on any drift from src/.
            // Fail closed: if the rule file is missing (e.g. the PR that introduces it,
            // judged against a default branch that does not have it yet), hold everything.
            const { isSensitive } = await import(
              `file://${process.env.GITHUB_WORKSPACE}/scripts/sensitive-paths.mjs`)
              .catch(() => ({ isSensitive: () => true }));
            const touchesSensitive = files.some(f =>
              isSensitive(f.filename) || (f.previous_filename && isSensitive(f.previous_filename)));
            const humanApproved = labels.includes('human-approved');

            // --- CI + agent-review check conclusions on the head sha ---
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: sha });
            const byName = (n) => checks.find(c => c.name === n);
            const ciOk = byName('verify')?.conclusion === 'success';
            // Agent review may be a check-run ("agent-review") or a commit status.
            let agentPass = byName('agent-review')?.conclusion === 'success';
            if (!agentPass) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner: context.repo.owner, repo: context.repo.repo, ref: sha });
              agentPass = statuses.some(s => s.context === 'agent-review' && s.state === 'success');
            }

            const sensitiveOk = !touchesSensitive || humanApproved;
            const canMerge = ciOk && agentPass && sensitiveOk;

            core.notice(`ci=${ciOk} agentReview=${agentPass} sensitive=${touchesSensitive} humanApproved=${humanApproved} => merge=${canMerge}`);
            core.setOutput('canMerge', String(canMerge));
            core.setOutput('number', String(number));
            if (touchesSensitive && !humanApproved) {
              core.notice('Blocked: touches sensitive paths and lacks the "human-approved" label.');
            }

      - name: Squash-merge
        if: steps.gates.outputs.canMerge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: Number('${{ steps.gates.outputs.number }}'),
              merge_method: 'squash',
            });
            core.notice('Auto-merged (CI green + agent-review PASS + sensitive-path gate satisfied).');
